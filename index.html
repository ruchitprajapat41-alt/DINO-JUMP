<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Jump</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="gameWrap">
        <div id="scoreBar">
            <span class="logo-text">🦖 DINO JUMP</span>
            <div class="score-right">
                <span>SCORE: <b id="score">0</b></span>
                <span>HI: <b id="highScore">0</b></span>
            </div>
        </div>

        <div id="bgLayer">
            <img class="bg-img" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80" alt="">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="sun"></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="screen" id="startScreen">
            <h1>🦖 DINO JUMP</h1>
            <button class="big-btn" id="startBtn">▶ START</button>
        </div>

        <div class="screen hide" id="overScreen">
            <h1 style="color: #e74c3c;">GAME OVER</h1>
            <p>Score: <b id="fScore">0</b></p>
            <button class="big-Btn" id="restartBtn">🔄 PLAY AGAIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
